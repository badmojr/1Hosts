name: Release

on:
  workflow_dispatch:
  push:
    branches:
      - master
    paths:
      - 'Lite/**'
      - 'Xtra/**'

permissions:
  contents: write

jobs:
  create_release:
    runs-on: ubuntu-latest

    steps:
      - name: Clone Repo
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0
          
      - name: Prep release
        id: purge_urls
        run: |
          set -euo pipefail

          EXCLUDE_NAMES="${EXCLUDE_NAMES:-exclude_for_all.txt,exclude_for_mini_Lite_only.txt}"
          INCLUDE_NAMES="${INCLUDE_NAMES:-include_for_Pro_Xtra_only.txt,include_for_all.txt}"


          listFiles() { find "$1" -type f -print; }

          base="https://cdn.jsdelivr.net/gh/${{ github.repository }}"
          versions="master latest"

          rm -rf release tmp && mkdir -p release tmp
          cp -rf Lite Xtra tmp && cd tmp

          L_DIR="${GITHUB_WORKSPACE}/-data/lists"

          normalize_stream() {
            sed -E 's/^[[:space:]]+|[[:space:]]+$//g' \
            | sed '/^[[:space:]]*$/d' \
            | sed '/^[[:space:]]*#/d' \
            | sed -E 's/^(\|\|?)+//; s/^\|+//' \
            | sed -E 's/(\^|\\\*|\/\*)$//g' \
            | sed -E 's/\*//g' \
            | tr '[:upper:]' '[:lower:]' \
            | sed -E 's~^https?://~~; s~^www\.~~; s:/*$::'
          }

          gather() {
            local names_csv="$1"; local out="$2"
            : > "$out"
            IFS=',' read -ra NAMES <<< "$names_csv"
            for n in "${NAMES[@]}"; do
              n="$(echo "$n" | sed 's/^[[:space:]]*//; s/[[:space:]]*$//')"
              [ -z "$n" ] && continue
              find "$L_DIR" -type f \( -name "$n" -o -name "${n}.*" \) -print0 2>/dev/null \
                | while IFS= read -r -d '' f; do
                    cat "$f" | normalize_stream >> "$out"
                  done || true
            done
            sort -u "$out" -o "$out" || true
          }

          excludes_tmp="$(mktemp)"; includes_tmp="$(mktemp)"
          : > "$excludes_tmp"; : > "$includes_tmp"
          if [ -d "$L_DIR" ]; then
            gather "$EXCLUDE_NAMES" "$excludes_tmp"
            gather "$INCLUDE_NAMES" "$includes_tmp"
          fi

          urls=""
          while read -r file; do
            basefile="$(basename "$file")"
            # skip configured include/exclude files if present in tmp
            for n in $(echo "$EXCLUDE_NAMES" | tr ',' ' '); do [ "$basefile" = "$n" ] && continue 2 || true; done
            for n in $(echo "$INCLUDE_NAMES" | tr ',' ' '); do [ "$basefile" = "$n" ] && continue 2 || true; done

            clean_file=$(echo "$file" | sed 's:\./::g; s:/:_:g')
            newname="1hosts-$clean_file"
            clean_path=$(echo "$file" | sed 's:\./::g')

            # normalize original file into tmp (preserve original ordering)
            orig_norm="$(mktemp)"
            normalize_stream < "$file" > "$orig_norm" || true

            # remove any normalized exclude lines
            if [ -s "$excludes_tmp" ]; then
              grep -Fvxf "$excludes_tmp" "$orig_norm" > "../release/$newname" || true
            else
              cp "$orig_norm" "../release/$newname"
            fi
            rm -f "$orig_norm"

            # append normalized includes (dedupe preserving order)
            if [ -s "$includes_tmp" ] && [ -f "../release/$newname" ]; then
              merged="$(mktemp)"
              cat "../release/$newname" "$includes_tmp" > "$merged" || true
              awk '!/^[[:space:]]*($|#)/ { if (!seen[$0]++) print $0 }' "$merged" > "../release/$newname" || true
              rm -f "$merged"
            fi

            # restore output to original-ish form: (no protocol/www/trailing slash, lowercased)
            # if you prefer to re-add "https://" prefix, uncomment the sed line below
            # sed -E 's~^(.*)$~https://\1~' "../release/$newname" > "${newname}.tmp" && mv "${newname}.tmp" "../release/$newname" || true

            # drop files empty after processing
            if ! grep -q '[^[:space:]#]' "../release/$newname"; then
              rm -f "../release/$newname"
              continue
            fi

            for v in $versions; do
              urls+="${base}@${v}/${clean_path},"
            done
          done < <(listFiles .)

          cd .. && rm -rf tmp
          echo "urls=${urls%,*}" >> $GITHUB_OUTPUT
        shell: bash
        env:
          EXCLUDE_NAMES: "exclude_for_all.txt,exclude_for_mini_Lite_only.txt"
          INCLUDE_NAMES: "include_for_Pro_Xtra_only.txt,include_for_all.txt"

      - name: Purge jsDelivr Cache
        if: steps.purge_urls.outputs.urls != ''
        uses: egad13/purge-jsdelivr-cache@v1.1.0
        with:
          url: ${{ steps.purge_urls.outputs.urls }}

      - name: Publish Release
        uses: marvinpinto/action-automatic-releases@v1.2.1
        with:
          repo_token: "${{ secrets.GITHUB_TOKEN }}"
          automatic_release_tag: "latest"
          prerelease: false
          title: "Lists"
          files: release/*

      - name: Delete Older Releases
        uses: dev-drprasad/delete-older-releases@v0.1.0
        with:
          keep_latest: 1
          delete_tags: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
