name: Deploy

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Release"]
    types: [completed]

concurrency:
  group: deploy-filters
  cancel-in-progress: true

jobs:
  deploy:
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success') }}
    runs-on: ubuntu-latest
    env:
      GH_TARGET_REPO: ${{ secrets.GH_TARGET_REPO }}
      GH_TARGET_PAT: ${{ secrets.GH_TARGET_PAT }}
      CODEBERG_REPO: ${{ secrets.CODEBERG_REPO }}
      CODEBERG_PAT: ${{ secrets.CODEBERG_PAT }}
      JSDELIVERRIDE_TAG: ${{ github.event.workflow_run.head_sha || github.sha }}
    steps:
      - name: Checkout source at released commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 0

      - name: Verify built artifact exists
        run: |
          if [ ! -d dist ] && [ ! -d build ]; then
            echo "No dist/build folder found."
            exit 1
          fi

      - name: Prepare output folder
        run: |
          rm -rf out
          mkdir out
          if [ -d dist ]; then cp -r dist/* out/; else cp -r build/* out/; fi

      - name: Publish to GitHub Pages (gh-pages)
        env:
          GH_TARGET_PAT: ${{ secrets.GH_TARGET_PAT }}
          GH_TARGET_REPO: ${{ secrets.GH_TARGET_REPO }}
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          cd out
          git init
          git checkout -b gh-pages
          git remote add target https://x-access-token:${GH_TARGET_PAT}@github.com/${GH_TARGET_REPO}.git
          git add --all
          git commit -m "Publish filter list: ${GITHUB_SHA}" || echo "No changes to commit"
          git push --force target gh-pages

      - name: Publish to Codeberg
        env:
          CODEBERG_PAT: ${{ secrets.CODEBERG_PAT }}
          CODEBERG_REPO: ${{ secrets.CODEBERG_REPO }}
        run: |
          cd out
          git init
          git checkout -b main
          git remote add codeberg https://x-access-token:${CODEBERG_PAT}@codeberg.org/${CODEBERG_REPO}
          git add --all
          git commit -m "Publish filter list: ${GITHUB_SHA}" || echo "No changes to commit"
          git push --force codeberg HEAD:main

      - name: Create tag on target repo for jsDelivr
        env:
          GH_TARGET_PAT: ${{ secrets.GH_TARGET_PAT }}
          GH_TARGET_REPO: ${{ secrets.GH_TARGET_REPO }}
          JSDELIVERRIDE_TAG: ${{ env.JSDELIVERRIDE_TAG }}
        run: |
          # Use provided tag SHA when available; fall back to current run SHA
          TAG_SHA="${JSDELIVERRIDE_TAG:-${GITHUB_SHA}}"
          curl -s -X POST \
            -H "Authorization: token ${GH_TARGET_PAT}" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/${GH_TARGET_REPO}/git/refs \
            -d "$(jq -n --arg ref "refs/tags/filters-${GITHUB_RUN_ID}" --arg sha "${TAG_SHA}" '{ref:$ref, sha:$sha}')" \
          || echo "Tag creation may have failed or already exists."

      - name: Success marker
        run: echo "Deploy finished"
